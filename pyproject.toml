[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ragkit"
version = "0.1.0"
description = "A production-grade RAG toolkit, built one lesson at a time."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Muhammed Safar" }]

# Base install is deliberately light: the `local` profile's heavy ML deps are an
# extra, so a clean clone can run the tests without downloading torch.
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "numpy>=1.26",
    "tiktoken>=0.8",
    "PyYAML>=6.0",
    "rich>=13.9",
    "typer>=0.15",
    "chromadb>=0.5.20",
    "bm25s>=0.2",
    "PyStemmer>=2.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
]

[project.optional-dependencies]
# Local embedding + reranking models. Pulls torch — a few GB.
local = [
    "sentence-transformers>=3.3",
    "torch>=2.5",
]
# Cloud providers: Claude for generation, Voyage for embeddings + reranking.
cloud = [
    "anthropic>=0.40",
    "voyageai>=0.3",
]
graph = [
    "networkx>=3.4",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.scripts]
ragkit = "ragkit.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["ragkit"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
